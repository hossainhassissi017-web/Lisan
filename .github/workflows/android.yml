name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png www/

      - name: Install Capacitor and add Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Android settings (SDK level, permissions, version, icon)
        run: |
          cd android
          # raise target/compile SDK to what Google Play currently asks for
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/; s/compileSdkVersion = .*/compileSdkVersion = 36/' variables.gradle
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null || true
          # version code increases with every run (needed for each Play upload)
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle
          # microphone + audio settings
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' app/src/main/AndroidManifest.xml
          # app icon: use our own icon instead of the default
          rm -rf app/src/main/res/mipmap-anydpi-v26
          IM=convert; command -v convert >/dev/null || IM="magick"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            $IM ../icon-512.png -resize ${s}x${s} app/src/main/res/mipmap-$n/ic_launcher.png
            cp app/src/main/res/mipmap-$n/ic_launcher.png app/src/main/res/mipmap-$n/ic_launcher_round.png
            cp app/src/main/res/mipmap-$n/ic_launcher.png app/src/main/res/mipmap-$n/ic_launcher_foreground.png
          done

      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --no-daemon

      - name: Signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p out
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > upload.keystore
            PASS="$KS_PASS"
            echo "Using your saved key."
          else
            PASS=$(openssl rand -hex 12)
            keytool -genkeypair -v -keystore upload.keystore -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Taallam, O=Taallam, C=MA"
            cp upload.keystore out/KEEP-THIS-upload.keystore
            {
              echo "alias: upload"
              echo "password: $PASS"
              echo ""
              echo "base64 of the key (put in secret KEYSTORE_BASE64):"
              base64 -w0 upload.keystore
              echo ""
            } > out/KEEP-THIS-key-info.txt
            echo "A NEW key was created. Save the files KEEP-THIS-*."
          fi
          echo "$PASS" > .pass
          cp android/app/build/outputs/bundle/release/app-release.aab out/taallam.aab
          jarsigner -keystore upload.keystore -storepass "$(cat .pass)" -keypass "$(cat .pass)" \
            -sigalg SHA256withRSA -digestalg SHA-256 out/taallam.aab upload
          cp android/app/build/outputs/apk/debug/app-debug.apk out/taallam-test.apk
          rm -f .pass

      - uses: actions/upload-artifact@v4
        with:
          name: taallam-android
          path: out/
